[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-channel-transcriber"
version = "0.1.0"
description = "Transcribe the latest public videos from a YouTube channel without API keys"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "keyfind" }]
dependencies = [
  "requests>=2.32,<3",
  "youtube-transcript-api==1.2.4",
  "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
yt-channel-transcriber = "yt_channel_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
